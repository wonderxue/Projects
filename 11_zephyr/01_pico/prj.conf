# 启用USB设备栈
CONFIG_USB_DEVICE_STACK=y

# 可选：设置USB设备描述符，让设备在主机上显示为友好的名称
CONFIG_USB_DEVICE_PRODUCT="Pico 2 USB Serial"
CONFIG_USB_DEVICE_VID=0x2E8A
CONFIG_USB_DEVICE_PID=0x000a

# 对于总线供电设备（如Pico 2），此项必须设为 'n'
CONFIG_USB_SELF_POWERED=n

# 确保USB设备在启动时初始化
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# 启用串行驱动器和控制台功能
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# 启用UART线路控制，这对于CDC ACM设备是必需的
CONFIG_UART_LINE_CTRL=y

# 如果需要，可以启用日志功能
CONFIG_LOG=y